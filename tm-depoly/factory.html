<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TM-Depoly — robot factory</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden; }
  /* Two stacked full-viewport layers: the ray-traced "photo" beneath, the live
     vector "blueprint" on top. The blueprint carries scroll/interaction at 60fps;
     the ray-trace fades in (blueprint fades out) when the view settles. */
  #rt, #wire {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
  }
  #rt { z-index: 0; background: #070b14; }
  #wire { z-index: 1; cursor: grab; touch-action: none; transition: opacity .6s ease; }
  #wire:active { cursor: grabbing; }
  .badge {
    position: fixed; right: 14px; bottom: 12px; z-index: 5;
    font: 500 12px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #9a9ba2; background: rgba(0,0,0,.42);
    border: 1px solid #2a2a2f; border-radius: 999px; padding: 6px 12px;
    text-decoration: none; letter-spacing: .01em; backdrop-filter: blur(4px);
  }
  .badge b { color: #4a86ff; font-weight: 600; }
  .badge:hover { color: #fff; }
</style>
</head>
<body>
  <canvas id="rt" aria-hidden="true"></canvas>
  <canvas id="wire" aria-label="TM-Depoly — automated robot factory, live 3D"></canvas>
  <a class="badge" href="https://github.com/thanhntmany" target="_blank" rel="noopener"><b>TM-Depoly</b> by Thanhnt.many</a>

  <script src="tmd.js"></script>
  <script src="tmd-gpu.js"></script>
  <script src="tmd.lib.js"></script>
  <script src="factory.js"></script>
</body>
</html>
